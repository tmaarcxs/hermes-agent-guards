name: hindsight-reviewer
version: "0.2.0"
description: >-
  After each gateway turn, review the Hindsight memories injected into that turn in a
  background thread, like Hermes' own background review. The model selected for cron jobs
  (or the main model when none is set) proposes memories the user's own message refutes,
  with an exact quote; a skeptical second pass must confirm. The memory is re-read, then
  invalidated through the stock Hindsight API with a per-turn reason, read back, and one
  notice is posted to the originating chat. No queue and no retries: any failure skips the
  turn. Keeps memory.provider: hindsight; recall ids are captured by wrapping the provider's
  prefetch. Model/provider override needs plugins.entries.hermes-agent-guards/hindsight-reviewer.llm.allow_model_override
  and allow_provider_override when cron.model is set.
author: "kur4i"
kind: standalone
hooks:
  - pre_gateway_dispatch
  - post_llm_call

name: agent-guards
version: "0.2.7"
description: Block long foreground sleeps and polling loops, unpinned PR merges, osascript, bare force pushes, repeated identical failing calls and oversized skill files; force a budget checkpoint before a worker run is cut at the iteration cap; block silent waits on approval-only pull requests and lead comments carrying a full PR URL onto a stalled card; normalize common Kanban argument slips; in worker setups enforce the Kanban delegation policy and pre-review checklist, refuse narrated stops after a blocked lifecycle call, and tell every lifecycle-call block to retry in the same response; wake a card's chat within one dispatcher tick of the state that triggers it (stale card, review loop, churn, or a dispatcher stall on the active_pr respawn guard), including a quiet board's first tick after a card crosses its 1 h stale age; re-notify a card's chat once per state when a terminal state event was never confirmed delivered (dropped subscription or none).
author: "tmaarcxs"
kind: standalone
hooks:
  - pre_tool_call
  - post_tool_call
  - pre_verify
  - on_kanban_dispatch_tick
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_verify
  - on_kanban_dispatch_tick

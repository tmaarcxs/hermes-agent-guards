name: agent-guards
version: "0.2.0"
description: Block long foreground sleeps, unpinned PR merges, osascript, bare force pushes, repeated identical failing calls and oversized skill files; normalize common Kanban argument slips; in worker setups enforce the Kanban delegation policy and pre-review checklist; wake a card's chat once when the card stops moving.
author: "tmaarcxs"
kind: standalone
hooks:
  - pre_tool_call
  - post_tool_call
  - on_kanban_dispatch_tick
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - on_kanban_dispatch_tick

name: agent-guards
version: "0.6.4"
description: Block long foreground sleeps and polling loops, unpinned PR merges, osascript, bare force pushes, recursive deletion of a live Hermes home or its ancestors, repeated identical failing calls and oversized skill files; force a budget checkpoint comment before a worker run is cut at the iteration cap; block silent waits on approval-only pull requests and lead comments carrying a full PR URL onto a stalled card; normalize common Kanban argument slips; in worker setups enforce the Kanban delegation policy and pre-review checklist and inject the lead swarm-split inventory rule once per user turn; keep the published-PR completion duty visible and cap the "PR acceptance missing" rejection loop, refuse narrated stops after a blocked lifecycle call, and tell every lifecycle-call block to retry in the same response; scope a lead chat's kanban_list result to the cards its own chat thread is subscribed to (worker processes and origin-less calls pass through); wake a card's chat within one dispatcher tick of the state that triggers it (stale card, review loop, churn, or a dispatcher stall on the active_pr respawn guard), including a quiet board's first tick after a card crosses its 5 min stale age; skip the stale wake for a capability-walled parked card and a triage escalation because the park's own dispatcher notification already reached the chats; wake a running card's chat when its heartbeat notes still admit a wait on an external gate (merge bot, approval, deploy, CI) at the newest note 15 min after the streak began; re-notify a card's chat once per state when a terminal state event was never confirmed delivered (dropped subscription or none).
author: "shard-guard"
kind: standalone
hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - pre_verify
  - transform_tool_result
  - on_kanban_dispatch_tick
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - pre_verify
  - transform_tool_result
  - on_kanban_dispatch_tick

name: agent-guards
version: "0.2.5"
description: Block long foreground sleeps, unpinned PR merges, osascript, bare force pushes, repeated identical failing calls and oversized skill files; block silent waits on approval-only pull requests and lead comments carrying a full PR URL onto a stalled card; normalize common Kanban argument slips; in worker setups enforce the Kanban delegation policy and pre-review checklist, refuse narrated stops after a blocked lifecycle call, and tell every lifecycle-call block to retry in the same response; wake a card's chat once when the card stops moving, grinds on (too many runs or change-requests) or sits dispatcher-stalled (active_pr respawn guard).
author: "tmaarcxs"
kind: standalone
hooks:
  - pre_tool_call
  - post_tool_call
  - pre_verify
  - on_kanban_dispatch_tick
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_verify
  - on_kanban_dispatch_tick

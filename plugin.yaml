name: agent-guards
version: "0.6.6"
description: Block long foreground sleeps and polling loops, unpinned PR merges, osascript, bare force pushes, recursive deletion of a live Hermes home or its ancestors and oversized skill files; force a budget checkpoint comment before a worker run is cut at the iteration cap; block silent waits on approval-only pull requests; normalize common Kanban argument slips; in worker setups enforce the Kanban delegation policy and pre-review checklist; nudge the lead once per user turn, after more than 5 work calls without a `kanban_create`, to split the remaining work across as many parallel cards as possible; keep the published-PR completion duty visible (reminder on `kanban_show`, fix suffix on the "PR acceptance missing" rejection), refuse narrated stops after a blocked lifecycle call, and tell every lifecycle-call block to retry in the same response; scope a lead chat's kanban_list result to the cards its own chat thread is subscribed to (worker processes and origin-less calls pass through); wake a card's chat within one dispatcher tick of the state that triggers it (a parked card's 5 min stale age, review-loop thresholds, the 10-charge-request churn corner, a dispatcher stall on the active_pr respawn guard, or a running card's wait streak on an external gate), including a quiet board's first tick after a parked card crosses its 5 min stale age; skip the stale-park wake for a capability-walled parked card and a triage escalation because the park's own dispatcher notification already reached the chats; hold stall wakes at least 10 minutes apart per card; re-notify a card's chat once per state when a terminal state event was never confirmed delivered (dropped subscription or none).
author: "shard-guard"
kind: standalone
hooks:
  - pre_tool_call
  - post_tool_call
  - pre_verify
  - transform_tool_result
  - on_kanban_dispatch_tick
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_verify
  - transform_tool_result
  - on_kanban_dispatch_tick

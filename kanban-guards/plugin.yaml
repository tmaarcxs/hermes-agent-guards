name: kanban-guards
version: "0.4.0"
description: >-
  Kanban discipline for worker and lead processes. Worker gates keep a dispatcher-owned
  run honest: force a budget checkpoint comment before the run is cut at the iteration
  cap, keep delegated cards on the configured worker profile (right assignee, out of
  triage, no execution overrides, numbered Acceptance list), block kanban_complete until
  metadata.acceptance maps every numbered Acceptance item to evidence, block a review
  request or completion whose git-worktree diff added unused private Python names or
  imports (one git grep -w per batch decides; __all__ names, dunders and __init__.py
  re-exports are exempt), keep the
  published-PR completion duty visible (reminder on kanban_show, fix suffix on the
  "PR acceptance missing" rejection), block contacts with people on GitHub from worker
  terminals (review requests, assignees, @mention comments) with owner-approval and
  needs_input guidance, bounce once per session a narrated stop after a
  blocked lifecycle call, block kanban_schedule (it ends the run with no timer), and
  refuse a handoff that preserves a backup/rollback copy of the delivered work.
  A lead-side rail: the lead terminal cannot create cards via `hermes kanban create`
  (that path writes no chat subscription, so the card finishes in silence); the block
  message rebuilds the exact kanban_create tool call from the blocked command's own
  flags — worker and reviewer runs keep the CLI.
  A dispatcher-tick observer auto-lifts the active_pr respawn guard when a human
  unblocked the card after its PR comment: it hops the card to another existing
  profile and back, so core's own guard sees a real handoff and the card spawns;
  loop protection is persisted in plugin-data and the cap posts one comment
  asking a human to decide.
  Lead gates keep chats on their own cards: nudge the lead once per user turn after more than
  8 work calls without a kanban_create to
  split the remaining work across parallel cards, scope a lead chat's kanban_list result
  to the cards its own chat thread is subscribed to (worker processes and origin-less
  calls pass through), and
  Wakes run every Kanban wake on one shared event-driven chassis over board_watch —
  stale parked cards once per parked stretch, review-loop change-request thresholds at
  3/6/9..., the 10-change-request churn corner, waiting-on-external-gate runs, dispatcher
  stalls, and unreconciled delivery notices — injected into the card's subscribed chat
  within one dispatcher tick (requires
  plugins.entries.kanban-guards.allow_gateway_injection: true). Block messages name the
  producing guard and tell lifecycle calls to retry in the same response; every guard
  fails open on its own error.
author: "shard-guard"
kind: standalone
hooks:
  - pre_tool_call
  - post_tool_call
  - pre_verify
  - transform_tool_result
  - on_kanban_dispatch_tick
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_verify
  - transform_tool_result
  - on_kanban_dispatch_tick

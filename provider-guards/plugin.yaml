name: provider-guards
version: "0.1.0"
description: >-
  Make an upstream provider failure retryable. GitHub Copilot returns HTTP 424
  `byok_upstream_provider_failed` when the model behind it fails; the core treats an unlisted 4xx as
  a non-retryable format error, so the turn ends on the first attempt and a Kanban worker run dies
  with all its work. The `transform_api_error_classification` hook classifies that 424 as a
  retryable `server_error`, so the core retries inside the same session with its own backoff and
  then consults the fallback chain. Any other status, code or message goes to the core unchanged,
  and the hook fails open on any error.
author: "tmaarcxs"
kind: standalone
hooks:
  - transform_api_error_classification
provides_hooks:
  - transform_api_error_classification

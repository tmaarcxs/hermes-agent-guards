name: provider-guards
version: "0.2.0"
description: >-
  Recover narrowly identified upstream failures through the classification hook.
  HTTP 424 BYOK failures remain retryable. Copilot HTTP 400 with the exact
  upstream_request_rejected code and generic provider-rejection message tries
  configured fallback without retrying the rejected primary. Other errors stay
  with the core classifier; malformed input fails open. No Hermes core changes.
author: "tmaarcxs"
kind: standalone
hooks:
  - transform_api_error_classification
provides_hooks:
  - transform_api_error_classification

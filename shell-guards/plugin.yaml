name: shell-guards
version: "0.4.0"
description: >
  Terminal command hygiene - block `process_manage` poll, foreground sleeps of 5s or more and polling
  loops holding a 3s+ sleep (run the wait with background=true and a notify
  channel; `wait` returns at the process exit and a short wait timeout is lifted
  to the configured limit), block a `pgrep -f`/`pkill -f` inside
  a loop (it self-matches the loop's own command line and never exits; use
  `pgrep -x` or test the target directly), block `gh pr merge` without
  `--match-head-commit` so merges pin the verified head, block `osascript`
  (desktop automation goes through ego-browser), block `gh auth switch`,
  `gh auth login`, `gh auth logout` and `gh auth refresh` (they change the
  shared active account for every Hermes process - to act as another account
  set it in the command: `GH_TOKEN=$(gh auth token -u <user>) <command>`, the
  default active account is `acme-bot`), block bare `git push
  --force`/`-f` (use `--force-with-lease`), and block recursive deletion of a
  live Hermes home (`rm -r`, `find -delete`, `rsync --delete`, python delete
  calls aimed at `$HERMES_HOME`, `~/.hermes` or its profiles subtree, an
  ancestor, or the same stage through a runner chain). Also: block a
  `paas-promote` workflow dispatch that targets `des` without the
  `auto-approval` label (the deployment pull request would otherwise stay open
  unmerged); turn `notify=true` on for every bounded `background=true` terminal job that
  declares no outcome channel (`notify=true`, a notify pattern list or a positive
  `heartbeat` - servers and pty sessions exempt), so each wait is event-driven; block `kanban_attach` with
  more than 256 characters of inline base64 (the model transcribes those bytes
  and corrupts them - attach by path); normalize optional Kanban arguments sent
  as empty strings into absent ones, a `task_id` of the literal
  `$HERMES_KANBAN_TASK` into absent (the tool falls back to the worker's own
  task), and doubled `skill_view` names `x:x` into `x`, and clamp a
  `process_manage wait` timeout to 5 s below the call deadline (a wait at or
  above it races the host deadline and dies with no partial output); and keep skill markdown
  files under their size limit - blocks a `skill_manage`/`write_file`/`patch`
  call that would push one over (SKILL.md 6000, other skill .md files 12000
  characters), flags after the fact a `terminal`/`execute_code`/unified-diff
  `patch` call that left one oversized (appending the required action and the
  tree-split instruction to the tool result without reverting), and refuses on
  `pre_verify` to end the turn while a flagged file is still over its limit
  (re-measured at check time; at most two continuations per file per session).
  Matches commands at command-word position
  outside quoted strings, so mentions in strings, grep patterns and python
  bodies pass; it catches slips, not deliberate evasion, and fails open.
author: "shard-guard"
kind: standalone
hooks:
  - pre_tool_call
  - post_tool_call
  - pre_verify
  - transform_tool_result
  - transform_terminal_output
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_verify
  - transform_tool_result
  - transform_terminal_output

name: goal-waker
version: "0.1.0"
description: >-
  Resume a parked /goal on a messaging chat when its wait barrier lifts. The gateway
  clears a goal barrier (timer, pid, process session) only while it evaluates a turn,
  and a parked goal produces no turn, so a chat with nothing else arriving stayed
  parked for hours. On each dispatcher tick (about every 60 s) the waker finds the
  active goals that carry a barrier, asks the goal manager whether it still holds, and
  injects the goal continuation prompt into the owning chat session once it lifted.
  Local CLI/TUI sessions are skipped (they have their own idle waker). A refused
  injection re-parks the goal for 30 s so it is retried and never left active with no
  turn coming. Needs plugins.entries.<id>.allow_gateway_injection: true.
author: "kur4i"
kind: standalone
hooks:
  - on_kanban_dispatch_tick
provides_hooks:
  - on_kanban_dispatch_tick

name: rtk-output
version: "0.1.1"
requires_plugins:
  - shell-guards
description: >-
  Compress successful foreground terminal output with the official RTK binary,
  after execution, without rewriting commands. Preserve failures and unsupported
  output; retain the full redacted input with a recovery pointer.
author: "tmaarcxs"
kind: standalone
hooks:
  - transform_terminal_output
provides_hooks:
  - transform_terminal_output

name: jot-guards
version: "0.2.0"
description: >-
  Placeholder over the Jot weekly board. The plugin's only gate was a pre_verify
  continue directive reminding the lead to record the turn's outcome on Jot;
  a reminder shapes behavior instead of enforcing it, so it is removed. The plugin
  ships no gate today and registers no hooks; the name stays installed so a
  plugins.entries line in a profile config keeps loading. Any future gate here
  must block, strip or transform and fail open.
author: "kur4i"

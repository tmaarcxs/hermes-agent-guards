name: text-guards
version: "0.1.0"
description: >-
  Strip the section-sign character (§) from the assistant's final reply. The operator forbids that
  character in anything the agent writes; this guard removes it from `transform_llm_output`
  before delivery, replacing it with a single space so "§4.3" becomes " 4.3" and the sentence
  stays readable. It only cuts the character: it never blocks a tool call, rejects an
  argument, or changes any other text. Fails open on any error.
author: "tmaarcxs"
kind: standalone
hooks:
  - transform_llm_output
provides_hooks:
  - transform_llm_output

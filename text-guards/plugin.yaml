name: text-guards
version: "0.2.0"
description: >-
  Cut the section-sign character out of anything the agent emits. The operator forbids it, so
  the guard removes it in two places: `transform_llm_output` cleans the final reply before
  delivery, and `pre_tool_call` rewrites tool arguments so a comment body, a file written by
  write_file/patch, or a shell command never carries it. Each occurrence is replaced by a single
  space, which keeps the words apart. It never blocks a call, rejects an argument or changes any
  other text, and it fails open on any error.
author: "tmaarcxs"
kind: standalone
hooks:
  - transform_llm_output
  - pre_tool_call
provides_hooks:
  - transform_llm_output
  - pre_tool_call

name: workspace-guards
version: "0.11.0"
description: Keeps the home directory clean and installed plugin checkouts untouched. Blocks creating new top-level entries directly under the home directory, resolving the command's real cwd from the terminal tool's `workdir` argument and the session's recorded cwd, not only an in-string `cd`; blocks writes into an installed plugin checkout (`~/.hermes/plugins/<name>/` or a profile's `plugins/<name>/` that is a git checkout with an origin), naming the matching clone, the `git worktree add` command and the `hermes plugins update` sync calls, failing open.
author: "shard-guard"
kind: standalone
hooks:
  - pre_tool_call
provides_hooks:
  - pre_tool_call
